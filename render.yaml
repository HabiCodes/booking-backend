services:
  - type: web
    name: event-booking-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: event-booking-db
          property: connectionString
      - key: PORT
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ORGANIZER_JWT_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: SHUTDOWN_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DB_SSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: CASHFREE_RETURN_URL
        sync: false
      - key: CASHFREE_NOTIFY_URL
        sync: false
      - key: HOSTINGER_API_TOKEN
        sync: false
      - key: HOSTINGER_MAILBOX_ID
        sync: false
      - key: EMAIL_FROM
        value: info@bigmembres.in
      - key: APP_URL
        sync: false
      - key: LOG_FILE_ENABLED
        value: "false"
      - key: DB_RUN_MIGRATIONS
        value: true

databases:
  - name: event-booking-db
    plan: starter
    databaseName: event_booking
    user: postgres
